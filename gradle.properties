org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# The version the APK carries and shows in its header. The demo scripts override it per build, so a
# second build installs as an update without editing this file:
#
#   ./gradlew -q :app:assembleRelease -Pshowcase.versionCode=2 -Pshowcase.versionName=1.1.0
showcase.versionCode=1
showcase.versionName=1.0.0
